[project]
name = "ner-smart-logistics"
version = "0.1.0"
description = "AI-powered smart logistics platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "pandas",
    "folium",
    "streamlit-folium",
    "plotly",
    "numpy",
    "scikit-learn",
    "xgboost",
    "geopy",
    "python-dotenv"
]

[tool.vercel]
entrypoint = "backend.main:app"